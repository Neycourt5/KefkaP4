name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development libraries
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dalamud'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "DALAMUD_HOME=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore KefkaP4Trainer.sln -p:Platform=x64

      - name: Run Core tests
        run: dotnet test KefkaP4Trainer.Core.Tests/KefkaP4Trainer.Core.Tests.csproj -c Release --no-restore

      - name: Build plugin
        run: dotnet build KefkaP4Trainer/KefkaP4Trainer.csproj -c Release -p:Platform=x64 --no-restore

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: KefkaP4Trainer
          path: KefkaP4Trainer/bin/x64/Release/KefkaP4Trainer/
          if-no-files-found: error
